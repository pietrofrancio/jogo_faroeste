<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/jogo.css">
    <script src="../js/jogo.js" defer></script>
    <title>Página do jogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <audio id="musicaJogo" loop></audio>
    <div class="game-container">

        <div id="hud">
            <span id="pontos">Ouro: 0</span>
            <button id="btnPause">⏸ Pausar</button>
            <span id="vidas">Vidas: 5 ♥</span>
        </div>

        <div id="cenario">
            <img id="protagonista" src="../img/morganaNormal.png" alt="Protagonista">
        </div>
        <div id="texto"></div>
        <div id="fade"></div>
    </div>

    <div id="gameOverMenu" class="oculto">

        <div class="painelGameOver">

            <h1>GAME OVER</h1>

            <p class="textoGameOver">
                O espírito da Morgana ainda resiste...
                <br><br>
                Deseja continuar a aventura?
            </p>

            <button id="comprar1Vida">
                ❤️ Comprar 1 Vida
                <span>3 moedas</span>
            </button>

            <button id="comprar2Vidas">
                ❤️❤️ Comprar 2 Vidas
                <span>5 moedas</span>
            </button>

            <button id="recusar">
                Reiniciar Jornada
            </button>

        </div>

    </div>
</body>

</html>
