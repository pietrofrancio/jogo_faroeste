<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final</title>

    <link rel="stylesheet" href="../css/fim.css">
</head>

<body>

    <!-- Cenário -->
    <img id="cenario" src="../img/cenarios/cenario_mina.jpg" alt="Cenário">

    <!-- Escurecimento -->
    <div id="fade"></div>

    <!-- Personagem (carregado dinamicamente) -->
    <img id="personagem" src="" alt="Personagem">

    <!-- Caixa de diálogo -->
    <div id="caixa-dialogo">
        
        <div id="nome-personagem"></div>

        <div id="texto"></div>

        <div class="botoes">
            <span class="pular">
                S - Pular
            </span>

            <span class="continuar">
                ESPAÇO - Continuar
            </span>
        </div>

    </div>

    <!-- Música -->
    <audio id="musica" loop>
        <source src="../music/final.mp3" type="audio/mpeg">
    </audio>

    <script src="../js/fim.js"></script>

</body>

</html>
