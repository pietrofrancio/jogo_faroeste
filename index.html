<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <title>Página Inicial</title>
</head>
<body>
    <div class="video-background">
        <video autoplay loop muted playsinline id="bg-video">
            <source src="./video/tela_inicial.mp4" type="video/mp4">
            Seu navegador não suporta vídeos em HTML5.
        </video>
        <div class="overlay"></div>
    </div>

    <main class="menu-container">
        <img src="./img/logo.png" alt="Sombras do Oeste" class="game-logo">

        <div class="button-group">

            <button id="btnAbrirModalJogar" class="btn-western btn-play" style="width: 100%;">
                <span class="btn-icon">
                    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="5,3 5,13 13,8" fill="currentColor"/>
                    </svg>
                </span>
                <span class="btn-label">Jogar</span>
                <span class="btn-arrows-right">▶▶</span>
            </button>

            <a href="./html/sobreJogo.html" class="btn-western btn_como_jogar">
                <span class="btn-icon">
                    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="1" width="10" height="13" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <rect x="2" y="1" width="2" height="13" fill="currentColor" opacity="0.5"/>
                        <line x1="5" y1="4" x2="10" y2="4" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="5" y1="7" x2="10" y2="7" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="5" y1="10" x2="8"  y2="10" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="11" y1="9" x2="14" y2="6" stroke="currentColor" stroke-width="1.5"/>
                        <polygon points="11,9 10,13 14,12" fill="currentColor"/>
                    </svg>
                </span>
                <span class="btn-label">Como Jogar</span>
            </a>

            <a href="./html/musica.html" class="btn-western" id="btn_musica">
                <span class="btn-icon">
                    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                        <rect x="1" y="3" width="14" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="4"  y1="3" x2="4"  y2="13" stroke="currentColor" stroke-width="1"/>
                        <line x1="7"  y1="3" x2="7"  y2="13" stroke="currentColor" stroke-width="1"/>
                        <line x1="10" y1="3" x2="10" y2="13" stroke="currentColor" stroke-width="1"/>
                        <line x1="13" y1="3" x2="13" y2="13" stroke="currentColor" stroke-width="1"/>
                        <rect x="2.5" y="3" width="2" height="5" fill="currentColor"/>
                        <rect x="5.5" y="3" width="2" height="5" fill="currentColor"/>
                        <rect x="8.5" y="3" width="2" height="5" fill="currentColor"/>
                        <rect x="11.5" y="3" width="2" height="5" fill="currentColor"/>
                    </svg>
                </span>
                <span class="btn-label">Sistema de Música</span>
            </a>

            <a href="./html/loja.html" class="btn-western btn-loja">
                <span class="btn-icon">
                    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="4" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="3" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="3" y1="10" x2="13" y2="10" stroke="currentColor" stroke-width="1.5"/>
                        <rect x="2" y="2" width="12" height="3" fill="currentColor"/>
                        <text x="8" y="14" text-anchor="middle" font-size="5" font-family="monospace" fill="currentColor" font-weight="bold">$</text>
                    </svg>
                </span>
                <span class="btn-label">Lojinha</span>
            </a>

            <a href="./html/desenvolvedor.html" class="btn-western btn-desenvolvedor">
                <span class="btn-icon">
                    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="8" cy="7" rx="4" ry="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <rect x="5" y="2" width="6" height="3" fill="currentColor"/>
                        <rect x="3" y="4" width="10" height="1.5" fill="currentColor"/>
                        <polygon points="8,5 8.5,6.5 10,6.5 8.8,7.4 9.3,9 8,8 6.7,9 7.2,7.4 6,6.5 7.5,6.5" fill="currentColor"/>
                        <path d="M4 11 Q8 15 12 11" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="4" y1="11" x2="4" y2="14" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="12" y1="11" x2="12" y2="14" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                </span>
                <span class="btn-label">Sobre os Devs</span>
            </a>

        </div>
    </main>

    <div id="modalJogar" class="modal-overlay">
        <div class="modal-content">
            
            <div id="etapaEscolha">
                <h2>Selecione o Modo de Jogo</h2>
                <div class="modal-buttons-row">
                    <button id="btnJogar1" class="btn-western">
                        <span class="btn-icon">
                            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                                <rect x="1" y="2" width="14" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
                                <rect x="3" y="4" width="4" height="8" fill="currentColor" opacity="0.5"/>
                                <rect x="9" y="4" width="4" height="8" fill="currentColor" opacity="0.5"/>
                                <line x1="7" y1="4" x2="7" y2="12" stroke="currentColor" stroke-width="1.5"/>
                                <line x1="9" y1="4" x2="9" y2="12" stroke="currentColor" stroke-width="1.5"/>
                                <rect x="6" y="7" width="4" height="2" fill="currentColor"/>
                            </svg>
                        </span>
                        <span class="btn-label">1 Jogador</span>
                    </button>

                    <button id="btnJogar2" class="btn-western">
                        <span class="btn-icon">
                            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="5" cy="7" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
                                <rect x="3" y="2.4" width="4" height="2" fill="currentColor"/>
                                <rect x="2" y="3.8" width="6" height="1" fill="currentColor"/>
                                <circle cx="11" cy="7" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
                                <rect x="9" y="2.4" width="4" height="2" fill="currentColor"/>
                                <rect x="8" y="3.8" width="6" height="1" fill="currentColor"/>
                                <path d="M2 13 Q5 16 8 13" fill="none" stroke="currentColor" stroke-width="1.3"/>
                                <path d="M8 13 Q11 16 14 13" fill="none" stroke="currentColor" stroke-width="1.3"/>
                            </svg>
                        </span>
                        <span class="btn-label">2 Jogadores</span>
                    </button>
                </div>
                <button id="btnFecharModal" class="btn-action">Voltar</button>
            </div>

            <div id="etapaConfirmacao" class="hidden">
                <h2 id="textoConfirmacao">Deseja iniciar o jogo?</h2>
                <div class="modal-buttons-row">
                    <button id="btnConfirmarSim" class="btn-action btn-sim">Sim</button>
                    <button id="btnConfirmarNao" class="btn-action btn-nao">Não</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Elementos do Modal
        const modal = document.getElementById('modalJogar');
        const btnAbrirModal = document.getElementById('btnAbrirModalJogar');
        const btnFecharModal = document.getElementById('btnFecharModal');
        
        const etapaEscolha = document.getElementById('etapaEscolha');
        const etapaConfirmacao = document.getElementById('etapaConfirmacao');
        const textoConfirmacao = document.getElementById('textoConfirmacao');
        
        const btnJogar1 = document.getElementById('btnJogar1');
        const btnJogar2 = document.getElementById('btnJogar2');
        const btnConfirmarSim = document.getElementById('btnConfirmarSim');
        const btnConfirmarNao = document.getElementById('btnConfirmarNao');

        let modoSelecionadoTemp = "1"; // Guarda temporariamente a escolha

        // Abrir modal ao clicar em "Jogar"
        btnAbrirModal.addEventListener('click', () => {
            modal.classList.add('active');
            etapaEscolha.classList.remove('hidden');
            etapaConfirmacao.classList.add('hidden');
        });

        // Fechar modal ao clicar em "Voltar"
        btnFecharModal.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        // Clicou em "1 Jogador"
        btnJogar1.addEventListener('click', () => {
            modoSelecionadoTemp = "1";
            mostrarConfirmacao("Iniciar jogo com 1 Jogador?");
        });

        // Clicou em "2 Jogadores"
        btnJogar2.addEventListener('click', () => {
            modoSelecionadoTemp = "2";
            mostrarConfirmacao("Iniciar jogo com 2 Jogadores?");
        });

        // Função que esconde a tela de escolha e mostra a de confirmar
        function mostrarConfirmacao(mensagem) {
            textoConfirmacao.innerText = mensagem;
            etapaEscolha.classList.add('hidden');
            etapaConfirmacao.classList.remove('hidden');
        }

        // Se o usuário clicar em "Não" (Cancela e volta a escolher 1 ou 2)
        btnConfirmarNao.addEventListener('click', () => {
            etapaConfirmacao.classList.add('hidden');
            etapaEscolha.classList.remove('hidden');
        });

        // Se o usuário clicar em "Sim" (Confirma, salva no Storage e vai pro jogo)
        btnConfirmarSim.addEventListener('click', () => {
            localStorage.setItem("modoJogo", modoSelecionadoTemp);
            window.location.href = "./html/intro.html";
        });
    </script>
</body>
</html>
